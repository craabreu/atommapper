[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "atommapper"
version = "0.1.0"
description = "Atom mapping of two molecules under LOMAP's rules, as a numbered reaction SMILES"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["rdkit>=2025.3", "networkx>=3.2", "scipy>=1.11"]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["ruff>=0.15", "ty>=0.0.90", "pre-commit>=4"]

[project.scripts]
atommapper = "atommapper.cli:main"

[tool.maturin]
# Mixed project: Python under src/, the Stage 1 engine in rust/, built as
# atommapper._mces. Building from source needs a Rust toolchain.
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "atommapper._mces"
features = ["python", "pyo3/extension-module"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
