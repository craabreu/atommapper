name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.15"
      - run: ruff check src tests benchmarks
      - run: ruff format --check src tests benchmarks

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
        working-directory: rust
      - run: cargo clippy --all-targets --features python -- -D warnings
        working-directory: rust
      - run: cargo test --release
        working-directory: rust

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -e ".[test]" "ty>=0.0.90"
      - run: ty check src tests

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -e ".[test]"
      - run: python -m pytest -q

  # The work limit's claim: the same calls stop with the same results on every machine.
  # tests/test_determinism.py holds hashes made on x86_64 Linux with the RDKit pinned here;
  # each platform the wheels are built for must reproduce them.
  determinism:
    name: determinism (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -e ".[test]" "rdkit==2026.9.2"
      - run: python -c "import rdkit; assert rdkit.__version__ == '2026.09.2', rdkit.__version__"
      - run: python -m pytest -q -rs tests/test_determinism.py
